[project]
name = "virexa-backend"
version = "0.2.0"
description = "Enterprise backend platform for Virexa"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic[email]>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "redis>=6.4,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "pytest-asyncio>=1.1,<2.0", "ruff>=0.12,<1.0", "mypy>=1.17,<2.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
